name: Build Stemit Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Stemit/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "Stemit/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build native Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.2.1"

      - name: Build Stemit release APKs
        run: gradle -p Stemit :app:assembleRelease --stacktrace

      - name: Upload installable release APKs
        uses: actions/upload-artifact@v4
        with:
          name: stemit-release-apks
          path: |
            Stemit/app/build/outputs/apk/release/app-arm64-v8a-release*.apk
            Stemit/app/build/outputs/apk/release/app-armeabi-v7a-release*.apk
          if-no-files-found: error
          retention-days: 14
